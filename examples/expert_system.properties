[introduction]
<h2>Eligibility expert system</h2>
<p>This expert system checks whether <strong>Ali is eligible</strong>.
A person must be both an <em>adult</em> and <em>employed</em> to qualify.</p>
<p>Move through the source code to read each fact and rule below.</p>

[1]
<p><strong>This is a Prolog fact.</strong></p>
<p>It declares that Ali is an adult in the knowledge base.</p>

[3-5]
This is an eligibility rule.
The :- symbol means IF.
The comma represents logical AND.

A person is eligible if that person is both an adult and employed.

[4]
This checks whether Person is an adult.
This single-line explanation takes precedence over the broader [3-5] rule.

[7]
This is the entry point.
It checks Ali's eligibility and prints a message when the check succeeds.

[9]
This fact declares that Ali is employed.
