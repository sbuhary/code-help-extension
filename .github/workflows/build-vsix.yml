name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Release tag must match package version ' + expected);"
      - name: Compile and test
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Upload downloadable VSIX
        uses: actions/upload-artifact@v4
        with:
          name: code-help-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-help-vsix
          path: package
      - name: Publish release with installable VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" package/*.vsix --verify-tag --title "Code Help $RELEASE_TAG" --notes "Download the .vsix asset below. In VS Code, open Extensions, choose Install from VSIX, then run Code Help: Start. Full setup instructions are in the README."
